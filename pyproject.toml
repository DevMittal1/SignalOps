[project]
name = "signalops-backend"
version = "0.1.0"
description = "SignalOps Direct Voice AI Agent backend powered by LiveKit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[deepgram,openai,silero,turn-detector]>=0.12.0",
    "livekit>=0.17.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "livekit-plugins-google>=1.5.15",
    "pymongo>=4.17.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "resend>=2.1.0",
]

[tool.uv]
package = false
