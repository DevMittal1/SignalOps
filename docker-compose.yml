version: '3.8'

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalops-api-server
    command: uv run server.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  voice-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalops-voice-worker
    command: uv run main.py start
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signalops-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_INTERNAL=http://api-server:8000
      - NEXT_PUBLIC_BACKEND_API=""
    depends_on:
      - api-server
    restart: always
